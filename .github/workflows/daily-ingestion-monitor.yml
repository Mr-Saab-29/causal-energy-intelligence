name: Daily ingestion monitor

on:
  schedule:
    # GitHub cron is UTC-only. If GitHub starts the run late, it still proceeds.
    - cron: "17 0 * * *"
  workflow_dispatch:

env:
  PYTHON: python
  PRICE_SOURCE: energy_charts
  ENERGY_CHARTS_BIDDING_ZONE: FR
  FRANCE_START_DATE: "2023-01-01"
  MLFLOW_TRACKING_ENABLED: "false"
  ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
  DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check Supabase configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "SUPABASE_DATABASE_URL secret is required."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ingest latest historical data
        run: make ingest-latest-cloud

      - name: Ingest future exogenous data
        run: make ingest-future-cloud

      - name: Upload ingested data
        uses: actions/upload-artifact@v7
        with:
          name: ingested-data
          path: data
          if-no-files-found: warn

  preflight-monitor:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      retrain: ${{ steps.operational_action.outputs.retrain }}
      action: ${{ steps.operational_action.outputs.action }}
      reasons: ${{ steps.operational_action.outputs.reasons }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore operational model state
        uses: actions/cache/restore@v5
        with:
          path: |
            models
            reports/metrics
            reports/predictions
            reports/rankings
            reports/recommendations
            reports/scenarios
            reports/carbon
            reports/monitoring
          key: operational-model-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            operational-model-state-${{ runner.os }}-

      - name: Download ingested data
        uses: actions/download-artifact@v7
        with:
          name: ingested-data
          path: data

      - name: Build pipeline health report
        run: make pipeline-health

      - name: Build forecast monitoring report
        run: make forecast-monitor

      - name: Decide operational action
        id: operational_action
        run: python scripts/decide_operational_action.py --github-output "$GITHUB_OUTPUT"

      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-reports
          path: |
            reports/metrics/pipeline_health.json
            reports/metrics/forecast_monitoring.json
          if-no-files-found: warn

  retrain:
    needs: preflight-monitor
    if: needs.preflight-monitor.outputs.retrain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore operational model state
        uses: actions/cache/restore@v5
        with:
          path: |
            models
            reports/metrics
            reports/predictions
            reports/rankings
            reports/recommendations
            reports/scenarios
            reports/carbon
            reports/monitoring
          key: operational-model-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            operational-model-state-${{ runner.os }}-

      - name: Download ingested data
        uses: actions/download-artifact@v7
        with:
          name: ingested-data
          path: data

      - name: Download preflight reports
        uses: actions/download-artifact@v7
        with:
          name: preflight-reports
          path: reports/metrics

      - name: Retrain champion models when needed
        run: make train-all-gated

      - name: Upload retrained operational state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrained-operational-state
          path: |
            models
            reports/metrics
            reports/predictions
            reports/rankings
            reports/recommendations
            reports/scenarios
            reports/carbon
            reports/monitoring
          if-no-files-found: warn

  publish-dashboard:
    needs:
      - preflight-monitor
      - retrain
    if: |
      always()
      && needs.preflight-monitor.result == 'success'
      && (needs.retrain.result == 'success' || needs.retrain.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets are required."
            exit 1
          fi
          case "$VERCEL_ORG_ID" in
            team_*|org_*) ;;
            *)
              echo "VERCEL_ORG_ID must start with team_ or org_. Check that the secret was copied without quotes or backslashes."
              exit 1
              ;;
          esac
          case "$VERCEL_PROJECT_ID" in
            prj_*) ;;
            *)
              echo "VERCEL_PROJECT_ID must start with prj_. Check that the secret was copied without quotes or backslashes."
              exit 1
              ;;
          esac
          case "$VERCEL_ORG_ID$VERCEL_PROJECT_ID" in
            *\\*)
              echo "Vercel secrets contain a backslash. Remove any markdown escape characters like \\_."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Restore operational model state
        uses: actions/cache/restore@v5
        with:
          path: |
            models
            reports/metrics
            reports/predictions
            reports/rankings
            reports/recommendations
            reports/scenarios
            reports/carbon
            reports/monitoring
          key: operational-model-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            operational-model-state-${{ runner.os }}-

      - name: Download ingested data
        uses: actions/download-artifact@v7
        with:
          name: ingested-data
          path: data

      - name: Download preflight reports
        uses: actions/download-artifact@v7
        with:
          name: preflight-reports
          path: reports/metrics

      - name: Download retrained operational state
        if: needs.preflight-monitor.outputs.retrain == 'true'
        uses: actions/download-artifact@v7
        with:
          name: retrained-operational-state

      - name: Build recommendations and dashboard from current champion
        run: make operational-publish

      - name: Save operational model state
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            models
            reports/metrics
            reports/predictions
            reports/rankings
            reports/recommendations
            reports/scenarios
            reports/carbon
            reports/monitoring
          key: operational-model-state-${{ runner.os }}-${{ github.run_id }}

      - name: Deploy dashboard to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"causal-energy-intelligence"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel whoami --token="$VERCEL_TOKEN"
          test -f frontend/dist/index.html
          mkdir -p .vercel/output/static
          cp -R frontend/dist/. .vercel/output/static/
          printf '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/index.html"}]}\n' > .vercel/output/config.json
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingestion-monitor-reports
          path: |
            reports/metrics/pipeline_health.json
            reports/metrics/forecast_monitoring.json
            reports/metrics/model_promotion_decision.json
            reports/metrics/future_recommendation_metadata.json
            reports/metrics/marginal_ranking_shift_metrics.json
            reports/rankings/future_marginal_workload_decision_rankings.csv
            reports/recommendations/future_champion_workload_recommendations.csv
            reports/recommendations/future_causal_adjusted_workload_recommendations.csv
            reports/scenarios/future_workload_scenario_recommendations.csv
            frontend/public/data/dashboard.json
          if-no-files-found: warn
